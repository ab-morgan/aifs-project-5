[server]
headless = true
port = 8501
address = "0.0.0.0"
maxUploadSize = 2

[logger]
level = "info"

[theme]
# Use a dark-ish base so the bubbles stand out
base = "dark"

# Primary accent color – matches the user message bubble
primaryColor = "#365972"

# Main page background (darker than bubbles)
backgroundColor = "#121212"

# Secondary background – matches the assistant bubble
secondaryBackgroundColor = "#787878"

# Default text color
textColor = "#FFFFFF"

# Global font choice
font = "sans serif"

