[pytest]
testpaths = version2/tests

# Add version2/ to the Python path so imports like `from services.x import y` work
pythonpath = version2

# Always run in dev environment during tests
env =
    APP_ENV=dev

addopts = -ra -q

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that call real external services
