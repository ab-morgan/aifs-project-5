[pytest]
# Tell pytest where to find tests
testpaths = version2/tests

# Make output cleaner and more readable
addopts = -ra -q

# Ignore noisy warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Optional markers (you can add more later)
markers =
    slow: marks tests as slow
    integration: marks integration tests
