# settings.dev.toml
# Development overrides — merged on top of settings.toml when APP_ENV=dev
# Safe to commit (no secrets).

[app]
env = "dev"
debug = true

[embeddings]
batch_size = 8          # smaller batches for faster iteration locally

[limits]
max_resume_chars = 100000   # relaxed for testing large resumes
max_upload_mb = 10

[server]
port = 8300
log_level = "debug"         # verbose Streamlit + app logging in dev

[prep]
# Dev prep settings — points at a dev/staging Supabase project.
# Use a small subset of job data for fast iteration.
log_level = "debug"         # verbose prep output in dev
batch_size = 8              # small batches — faster feedback, easier to debug
skip_if_exists = true       # don't recompute if embeddings already present
source_table = "jobhop_raw" # raw job data table to embed
